name: LlamaCon99App
options:
  bundleIdPrefix: com
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LlamaCon99App:
    type: application
    platform: iOS
    sources:
      - LlamaCon99App
      - Shared
    info:
      path: LlamaCon99App/Info.plist
      properties:
        CFBundleDisplayName: Contactos
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - tel
          - telprompt
        NSContactsUsageDescription: Para mostrar tus contactos y llamarlos directamente desde la app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamacon99
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: LlamaCon99App/LlamaCon99App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llamacon99.shared
    dependencies:
      - target: CallerIDExtension
        embed: true
    scheme:
      testTargets: []

  CallerIDExtension:
    type: app-extension
    platform: iOS
    sources:
      - CallerIDExtension
      - Shared
    info:
      path: CallerIDExtension/Info.plist
      properties:
        CFBundleDisplayName: CallerID
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamacon99.CallerIDExtension
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO
    entitlements:
      path: CallerIDExtension/CallerIDExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llamacon99.shared
